[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arrivalcast"
version = "1.0.0"
description = "Probabilistic next-arrival forecasting for recurring events with Poisson, Hawkes, Neural Hawkes and log-normal-mixture point processes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anushree Das" }]
keywords = ["temporal point process", "hawkes process", "neural hawkes", "probabilistic forecasting", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# numpy<2 is pinned on purpose: torch<2.3 is built against the NumPy 1.x C API.
# To use NumPy 2.x, install torch>=2.3 as well.
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyarrow>=14.0",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["holidays>=0.40", "requests>=2.31", "tqdm>=4.66"]
notebooks = ["jupyter>=1.0", "nbformat>=5.9", "statsmodels>=0.14"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "pre-commit>=3.5", "holidays>=0.40", "requests>=2.31", "tqdm>=4.66"]

[project.scripts]
arrivalcast = "arrivalcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that train small neural models (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["notebooks", "paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702", "E731", "B023", "B905", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.coverage.run]
source = ["arrivalcast"]
